<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#e30613">
<title>PSM Monitoring</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222
}
header{
 background:#e30613;color:#fff;padding:16px 18px;
 position:sticky;top:0;z-index:5
}
header h1{margin:0;font-size:21px}
header small{opacity:.9}

main{max-width:900px;margin:auto;padding:14px 14px 95px}

.nav{
 position:fixed;bottom:0;left:0;right:0;background:#fff;
 border-top:1px solid #ddd;display:flex;z-index:10
}
.nav button{
 flex:1;border:0;background:white;padding:9px 2px;
 font-size:10px;color:#555
}
.nav button.active{color:#e30613;font-weight:bold}

.card{
 background:#fff;border-radius:16px;padding:15px;
 margin-bottom:13px;box-shadow:0 2px 8px #00000012
}

h2{font-size:18px;margin:4px 0 12px}

.tabs{
 display:flex;gap:7px;overflow:auto;margin-bottom:12px
}
.tabs button{
 border:1px solid #ddd;background:#fff;border-radius:10px;
 padding:9px 15px;white-space:nowrap
}
.tabs button.active{
 background:#e30613;color:#fff;border-color:#e30613
}

.monthbar{
 display:grid;grid-template-columns:1fr 1fr;
 gap:9px;margin-bottom:12px
}

label{
 display:block;font-size:12px;font-weight:bold;
 margin:8px 0 5px
}

input,select{
 width:100%;padding:11px;border:1px solid #ccc;
 border-radius:10px;font-size:14px;background:#fff
}

.grid{
 display:grid;grid-template-columns:1fr 1fr;gap:10px
}

.stat{
 padding:13px;border-radius:12px;background:#f7f7f7
}
.stat b{

}

.red{color:#e30613}
.green{color:#149447}
.orange{color:#d98200}
.muted{color:#777;font-size:12px}

button.primary{
 background:#e30613;color:white;border:0;
 border-radius:10px;padding:11px 14px;font-weight:bold
}
button.yellow{
 background:#ffca05;color:#111;border:0;
 border-radius:10px;padding:11px 14px;font-weight:bold
}
button.secondary{
 background:#eee;border:0;border-radius:10px;
 padding:10px 13px
}
button.danger{
 background:#ffe9e9;color:#e30613;border:0;
 border-radius:10px;padding:10px 13px;font-weight:bold
}

.actions{
 display:flex;gap:7px;flex-wrap:wrap;margin-top:10px
}
.actions button{flex:1;min-width:90px}

.info{
 background:#fff7d6;border-left:4px solid #ffca05;
 padding:11px;border-radius:8px;font-size:13px
}

.item{
 border:1px solid #eee;border-radius:14px;
 padding:12px;margin:10px 0;background:#fff
}

.item-head{
 display:flex;gap:12px;align-items:center
}

.product-photo{
 width:72px;height:72px;border-radius:12px;
 object-fit:cover;background:#f1f1f1;
 border:1px solid #eee;flex-shrink:0
}

.no-photo{
 width:72px;height:72px;border-radius:12px;
 background:#f2f2f2;display:flex;
 align-items:center;justify-content:center;
 font-size:30px;flex-shrink:0
}

.item-title{
 font-weight:bold;font-size:16px
}

.item-number{
 width:28px;height:28px;border-radius:50%;
 background:#e30613;color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-weight:bold;font-size:13px;flex-shrink:0
}

.product-info{flex:1}

.badge{
 display:inline-block;padding:4px 8px;
 border-radius:20px;background:#f2f2f2;
 font-size:10px;font-weight:bold
}

.price{
 color:#e30613;font-weight:bold;margin-top:4px
}

.progress{
 height:9px;background:#eee;border-radius:20px;
 overflow:hidden;margin-top:8px
}
.progress i{
 display:block;height:100%;
 background:#e30613;border-radius:20px
}

.photo-actions{
 display:flex;gap:7px;margin-top:9px
}
.photo-actions button{
 flex:1
}

.cashier-item{
 display:grid;
 grid-template-columns:60px 1fr;
 gap:12px;
 align-items:center;
 border:1px solid #eee;
 padding:12px;
 border-radius:14px;
 margin:10px 0
}

.cashier-photo{
 width:60px;height:60px;
 border-radius:11px;object-fit:cover;
 background:#f1f1f1
}

.cashier-no-photo{
 width:60px;height:60px;border-radius:11px;
 background:#f1f1f1;
 display:flex;align-items:center;
 justify-content:center;font-size:25px
}

.cashier-target{
 background:#f7f7f7;
 border-radius:10px;
 padding:10px;
 margin-top:8px
}

table{
 width:100%;border-collapse:collapse;
 font-size:13px
}
th,td{
 border-bottom:1px solid #eee;
 padding:9px 5px;text-align:left
}
th{background:#fafafa}

.empty{
 text-align:center;color:#888;padding:25px
}

.totalbox{
 background:#fff;border:1px solid #eee;
 border-radius:12px;padding:12px;margin-top:10px
}

.row{
 display:flex;justify-content:space-between;
 gap:8px;align-items:center;margin:6px 0
}

.toast{
 position:fixed;left:50%;bottom:75px;
 transform:translateX(-50%);
 background:#222;color:#fff;
 padding:10px 15px;border-radius:10px;
 font-size:12px;z-index:50;display:none
}

.upload-box{
 border:2px dashed #ddd;
 border-radius:12px;
 padding:14px;text-align:center;
 margin-top:10px
}

.upload-box input{border:0;padding:5px}

@media(max-width:600px){
 .monthbar{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>
<h1>📊 PSM Monitoring</h1>
<small>Produk Spesial Mingguan</small>
</header>

<main id="app"></main>

<nav class="nav">
<button data-page="dashboard">🏠<br>Dashboard</button>
<button data-page="toko">🎯<br>Target Toko</button>
<button data-page="kasir">👤<br>Target Kasir</button>
<button data-page="info">📋<br>Info Target</button>
<button data-page="laporan">📈<br>Laporan</button>
<button data-page="pengaturan">⚙️<br>Pengaturan</button>
</nav>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   PSM MONITORING
   - Target pencapaian toko (%)
   - Input qty pencapaian harian
   - Target per item
   - Harga tiap item terpisah
   - Foto produk dari galeri
   - Foto tampil di Target Toko & Target Kasir
   - Target Kasir = Target Item / Pembagi
   - Tidak ada Orang 1/2/3
   - Tidak ada target keseluruhan qty/week
   - Penyimpanan data LocalStorage
   - Foto produk menggunakan IndexedDB
========================================================= */

const KEY="psm_monitoring_v3";

let db=loadDB();
let page="dashboard";
let week=1;
let selectedDate="";

/* =========================
   DATABASE
========================= */

function freshDB(){
 const d=new Date();

 return {
  month:d.getMonth()+1,
  year:d.getFullYear(),

  settings:{
   cashierDivisor:3
  },

  weeks:{}
 };
}

function loadDB(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY)||"null");

  if(x&&typeof x==="object"){
   if(!x.settings)x.settings={cashierDivisor:3};
   if(!x.settings.cashierDivisor)x.settings.cashierDivisor=3;
   if(!x.weeks)x.weeks={};
   return x;
  }

  return freshDB();

 }catch(e){
  return freshDB();
 }
}

function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
}

function ensureWeek(w=week){

 if(!db.weeks)db.weeks={};

 if(!db.weeks[w]){
  db.weeks[w]={
   shopTarget:100,
   items:[],
   daily:{}
  };
 }

 const d=db.weeks[w];

 if(!Array.isArray(d.items))d.items=[];
 if(!d.daily)d.daily={};

 if(!Number.isFinite(Number(d.shopTarget))){
  d.shopTarget=100;
 }

 return d;
}

function data(){
 return ensureWeek(week);
}

/* =========================
   TANGGAL
========================= */

function daysInWeek(w){

 const y=Number(db.year);
 const m=Number(db.month);

 const last=new Date(y,m,0).getDate();

 const ranges={
  1:[1,7],
  2:[8,15],
  3:[16,23],
  4:[24,last]
 };

 return ranges[w];
}

function weekDays(w=week){

 const r=daysInWeek(w);

 return r[1]-r[0]+1;
}

function monthText(){

 return new Date(
  Number(db.year),
  Number(db.month)-1,
  1
 ).toLocaleString("id-ID",{month:"long"})
 .toUpperCase();
}

function weekName(w){

 const r=daysInWeek(w);

 return `WEEK ${w} | ${String(r[0]).padStart(2,"0")}-${String(r[1]).padStart(2,"0")} ${monthText()} ${db.year}`;
}

function dateKey(day){

 return `${db.year}-${String(db.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

function weekDates(w=week){

 const r=daysInWeek(w);
 const arr=[];

 for(let d=r[0];d<=r[1];d++){
  arr.push(dateKey(d));
 }

 return arr;
}

function todayKey(){

 const d=new Date();

 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function selectedDay(){

 const dates=weekDates();

 if(selectedDate&&dates.includes(selectedDate)){
  return selectedDate;
 }

 const t=todayKey();

 if(dates.includes(t))return t;

 return dates[0];
}

function dateLabel(s){

 if(!s)return "-";

 const p=s.split("-").map(Number);

 return `${String(p[2]).padStart(2,"0")} ${
  new Date(p[0],p[1]-1,1)
  .toLocaleString("id-ID",{month:"short"})
 } ${p[0]}`;
}

/* =========================
   FORMAT
========================= */

function rup(n){
 return "Rp"+Number(n||0).toLocaleString("id-ID");
}

function fmt(n){
 return Number(n||0).toLocaleString("id-ID",{
  maximumFractionDigits:2
 });
}

function pct(a,t){

 return t
  ?((Number(a||0)/Number(t||0))*100).toFixed(2)+"%"
  :"0%";
}

function esc(s){

 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

/* =========================
   TARGET TOKO
========================= */

function shopTarget(){

 return Number(data().shopTarget||100);
}

function setShopTarget(){

 const old=shopTarget();

 const v=Number(prompt(
  "Target pencapaian toko (%):",
  old
 ));

 if(!Number.isFinite(v)||v<0)return;

 data().shopTarget=v;

 save();
 render();

 toast("Target pencapaian toko disimpan.");
}

/* =========================
   PRODUK
========================= */

function addItem(){

 const name=prompt("Nama produk/item:");

 if(!name)return;

 const price=Number(prompt(
  `Harga ${name.trim()} per pcs (Rp):`,
  "0"
 ));

 if(!Number.isFinite(price)||price<0)return;

 const target=Number(prompt(
  `Target ${name.trim()} per week (qty):`,
  "0"
 ));

 if(!Number.isFinite(target)||target<0)return;

 const id=
  "item_"+Date.now()+"_"+
  Math.random().toString(36).slice(2,7);

 data().items.push({
  id:id,
  name:name.trim(),
  price:price,
  target:target
 });

 save();

 uploadPhotoForItem(id);

 render();

 toast("Produk berhasil ditambahkan.");
}

function editItem(id){

 const x=data().items.find(i=>i.id===id);

 if(!x)return;

 const n=prompt("Nama produk:",x.name);

 if(n===null)return;

 const p=Number(prompt(
  `Harga ${n.trim()} per pcs (Rp):`,
  x.price||0
 ));

 if(!Number.isFinite(p)||p<0)return;

 const t=Number(prompt(
  `Target ${n.trim()} per week (qty):`,
  x.target||0
 ));

 if(!Number.isFinite(t)||t<0)return;

 x.name=n.trim();
 x.price=p;
 x.target=t;

 save();
 render();

 toast("Produk berhasil diperbarui.");
}

function delItem(id){

 const x=data().items.find(i=>i.id===id);

 if(!x)return;

 if(!confirm(
  `Hapus produk "${x.name}" beserta data actual dan fotonya?`
 ))return;

 data().items=
  data().items.filter(i=>i.id!==id);

 Object.keys(data().daily||{}).forEach(dt=>{
  if(data().daily[dt]){
   delete data().daily[dt][id];
  }
 });

 deletePhoto(id);

 save();
 render();

 toast("Produk berhasil dihapus.");
}

/* =========================
   ACTUAL HARIAN
========================= */

function actualOnDate(id,date){

 return Number(
  data().daily?.[date]?.[id]||0
 );
}

function actualItem(id){

 let total=0;

 Object.values(data().daily||{}).forEach(day=>{
  total+=Number(day?.[id]||0);
 });

 return total;
}

function actualToday(){

 const date=selectedDay();

 return data().items.reduce(
  (s,x)=>s+actualOnDate(x.id,date),
  0
 );
}

function totalActual(){

 return data().items.reduce(
  (s,x)=>s+actualItem(x.id),
  0
 );
}

function inputActual(id){

 const x=data().items.find(i=>i.id===id);

 if(!x)return;

 const date=selectedDay();

 if(!data().daily[date]){
  data().daily[date]={};
 }

 const old=actualOnDate(id,date);

 const q=Number(prompt(
  `Qty pencapaian ${x.name}\n${dateLabel(date)}:`,
  old
 ));

 if(!Number.isFinite(q)||q<0)return;

 data().daily[date][id]=q;

 save();
 render();

 toast("Qty pencapaian harian disimpan.");
}

function inputDailyTotal(){

 const date=selectedDay();

 const current=actualToday();

 const v=Number(prompt(
  `Qty pencapaian toko hari ${dateLabel(date)}:`,
  current
 ));

 if(!Number.isFinite(v)||v<0)return;

 /*
  Qty toko bisa diinput langsung.
  Sistem memasukkan angka ke produk pertama
  hanya jika belum ada pencatatan produk.
 */
 if(data().items.length===0){
  alert("Tambahkan produk terlebih dahulu.");
  return;
 }

 if(!data().daily[date]){
  data().daily[date]={};
 }

 let existing=actualToday();

 if(existing===0){
  data().daily[date][data().items[0].id]=v;
 }else{

  const diff=v-existing;

  data().daily[date][data().items[0].id]=
   Math.max(
    0,
    Number(data().daily[date][data().items[0].id]||0)+diff
   );
 }

 save();
 render();

 toast("Qty pencapaian toko disimpan.");
}

/* =========================
   FOTO PRODUK
   IndexedDB
========================= */

let photoDB=null;

function openPhotoDB(){

 return new Promise((resolve,reject)=>{

  if(photoDB){
   resolve(photoDB);
   return;
  }

  const req=indexedDB.open(
   "PSM_Product_Photos",
   1
  );

  req.onupgradeneeded=e=>{

   const dbi=e.target.result;

   if(!dbi.objectStoreNames.contains("photos")){
    dbi.createObjectStore("photos");
   }
  };

  req.onsuccess=e=>{
   photoDB=e.target.result;
   resolve(photoDB);
  };

  req.onerror=()=>{
   reject(req.error);
  };

 });
}

async function savePhoto(id,file){

 try{

  const dbi=await openPhotoDB();

  await new Promise((resolve,reject)=>{

   const tx=dbi.transaction(
    "photos",
    "readwrite"
   );

   tx.objectStore("photos")
    .put(file,id);

   tx.oncomplete=resolve;
   tx.onerror=()=>reject(tx.error);

  });

 }catch(e){
  console.log(e);
 }
}

async function getPhoto(id){

 try{

  const dbi=await openPhotoDB();

  return await new Promise((resolve,reject)=>{

   const tx=dbi.transaction(
    "photos",
    "readonly"
   );

   const req=
    tx.objectStore("photos").get(id);

   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error);

  });

 }catch(e){
  return null;
 }
}

async function deletePhoto(id){

 try{

  const dbi=await openPhotoDB();

  const tx=dbi.transaction(
   "photos",
   "readwrite"
  );

  tx.objectStore("photos").delete(id);

 }catch(e){}
}

function uploadPhotoForItem(id){

 const input=document.createElement("input");

 input.type="file";
 input.accept="image/*";

 input.onchange=async()=>{

  const file=input.files[0];

  if(!file)return;

  await savePhoto(id,file);

  render();

  toast("Foto produk berhasil disimpan.");
 };

 input.click();
}

function changePhoto(id){

 uploadPhotoForItem(id);
}

/* =========================
   FOTO DATA URI UNTUK UI
========================= */

async function photoURL(id){

 const file=await getPhoto(id);

 if(!file)return null;

 return URL.createObjectURL(file);
}

async function refreshPhotos(){

 const imgs=document.querySelectorAll(
  "[data-photo-id]"
 );

 for(const img of imgs){

  const id=img.dataset.photoId;

  const url=await photoURL(id);

  if(url){

   img.src=url;

   img.style.display="block";

  }
 }
}

/* =========================
   NAVIGATION
========================= */

function setWeek(w){

 week=Number(w);
 selectedDate="";

 render();
}

function changeMonth(v){

 if(!v)return;

 const p=v.split("-").map(Number);

 db.year=p[0];
 db.month=p[1];

 week=1;
 selectedDate="";

 save();
 render();
}

function monthControls(){

 return `
 <div class="monthbar">

  <div>
   <label>Bulan</label>

   <input
    type="month"
    value="${db.year}-${String(db.month).padStart(2,"0")}"
    onchange="changeMonth(this.value)"
   >
  </div>

  <div>
   <label>Week Aktif</label>

   <input
    value="${weekName(week)}"
    readonly
   >
  </div>

 </div>`;
}

function tabs(){

 return `
 <div class="tabs">

 ${[1,2,3,4].map(w=>`
  <button
   class="${week==w?"active":""}"
   onclick="setWeek(${w})"
  >
   Week ${w}
  </button>
 `).join("")}

 </div>`;
}

function go(p){

 page=p;
 render();
}

/* =========================
   RENDER
========================= */

function render(){

 const a=document.getElementById("app");

 if(page==="dashboard")
  a.innerHTML=dashboard();

 if(page==="toko")
  a.innerHTML=toko();

 if(page==="kasir")
  a.innerHTML=kasir();

 if(page==="info")
  a.innerHTML=infoTarget();

 if(page==="laporan")
  a.innerHTML=laporan();

 if(page==="pengaturan")
  a.innerHTML=pengaturan();

 document
  .querySelectorAll(".nav button")
  .forEach(b=>{
   b.classList.toggle(
    "active",
    b.dataset.page===page
   );
  });

 refreshPhotos();
}

/* =========================
   DASHBOARD
========================= */

function dashboard(){

 const target=shopTarget();
 const actual=actualToday();

 const ach=
  target?actual:0;

 const itemCount=data().items.length;

 return `
 ${monthControls()}
 ${tabs()}

 <div class="card">

  <h2>🏠 Dashboard</h2>

  <div class="info">
   <b>${weekName(week)}</b><br>
   Monitoring pencapaian toko dan produk.
  </div>

  <div class="grid" style="margin-top:12px">

   <div class="stat">
    Target Pencapaian Toko
    <b>${fmt(target)}%</b>
   </div>

   <div class="stat">
    Qty Hari Ini
    <b class="green">${fmt(actual)} pcs</b>
   </div>

  </div>

 </div>

 <div class="card">

  <h2>📦 Produk</h2>

  <div class="stat">
   Jumlah Produk
   <b>${itemCount}</b>
  </div>

 </div>`;
}

/* =========================
   TARGET TOKO
========================= */

function toko(){

 const target=shopTarget();
 const today=selectedDay();
 const actual=actualToday();

 return `
 ${monthControls()}
 ${tabs()}

 <div class="card">

  <div class="row">

   <div>
    <h2>🎯 Target Toko</h2>

    <div class="muted">
     Target pencapaian per toko
    </div>
   </div>

   <button
    class="yellow"
    onclick="setShopTarget()"
   >
    ⚙ Target
   </button>

  </div>

  <div class="grid">

   <div class="stat">
    Target Pencapaian Toko
    <b>${fmt(target)}%</b>
   </div>

   <div class="stat">
    Qty Pencapaian Hari Ini
    <b class="green">${fmt(actual)} pcs</b>
   </div>

  </div>

  <div class="totalbox">

   <div class="row">
    <span>Tanggal Input</span>
    <b>${dateLabel(today)}</b>
   </div>

   <button
    class="primary"
    onclick="inputDailyTotal()"
    style="width:100%;margin-top:8px"
   >
    ＋ Input Qty Pencapaian Hari Ini
   </button>

  </div>

  <div class="info" style="margin-top:12px">

   <b>Catatan:</b><br>

   Target toko menggunakan persentase
   pencapaian per toko. Qty pencapaian
   harian dapat diinput setiap hari.

   <br><br>

   Target masing-masing produk
   diatur pada daftar produk di bawah.

  </div>

 </div>

 <div class="card">

  <div class="row">

   <div>
    <h2>📦 Daftar Target Produk</h2>

    <div class="muted">
     Urutan produk otomatis
    </div>
   </div>

   <button
    class="primary"
    onclick="addItem()"
   >
    ＋ Produk
   </button>

  </div>

  ${
   data().items.length
   ?data().items.map((x,i)=>itemCard(x,i)).join("")
   :`
    <div class="empty">
     Belum ada produk.<br><br>
     Tambahkan produk pertama.
    </div>
   `
  }

 </div>`;
}

function itemCard(x,index){

 const today=selectedDay();

 const actual=actualItem(x.id);
 const actualTodayValue=
  actualOnDate(x.id,today);

 const target=Number(x.target||0);

 const acv=
  target?actual/target*100:0;

 const photo=
  `<img
   class="product-photo"
   data-photo-id="${x.id}"
   src=""

function actualPhotoText(id){

/* =========================
   TARGET KASIR
========================= */

function cashierDivisor(){

 const n=Number(
  db.settings?.cashierDivisor
 );

 return Number.isFinite(n)&&n>0
  ?n
  :3;
}

function kasir(){

 const divisor=cashierDivisor();

 const items=data().items;

 const totalTarget=items.reduce(
  (s,x)=>s+Number(x.target||0),
  0
 );

 const totalCashier=
  totalTarget/divisor;

 return `
 ${monthControls()}
 ${tabs()}

 <div class="card">

  <h2>👤 Target Kasir</h2>

  <div class="info">

   Target Kasir bukan nama kasir.

   <br><br>

   Sistem mengambil
   <b>nama produk, foto, harga dan target item</b>
   dari menu Target Toko.

   <br><br>

   Target Kasir otomatis =
   <b>Target Item ÷ ${fmt(divisor)}</b>.

  </div>

  <div class="grid" style="margin-top:12px">

   <div class="stat">
    Jumlah Item
    <b>${items.length}</b>
   </div>

   <div class="stat">
    Pembagi
    <b>${fmt(divisor)}</b>
   </div>

   <div class="stat">
    Total Target Item
    <b>${fmt(totalTarget)} pcs</b>
   </div>

   <div class="stat">
    Total Target Kasir
    <b class="green">
     ${fmt(totalCashier)} pcs
    </b>
   </div>

  </div>

 </div>

 <div class="card">

  <h2>🎯 Target Kasir Per Item</h2>

  ${
   items.length
   ?items.map((x,i)=>cashierItem(x,i)).join("")
   :`
    <div class="empty">
     Belum ada produk.<br>
     Tambahkan produk di Target Toko.
    </div>
   `
  }

 </div>`;
}

function cashierItem(x,index){

 const target=Number(x.target||0);
 const divisor=cashierDivisor();

 const cashierTarget=target/divisor;

 return `
 <div class="cashier-item">

  <div>

   <img
    class="cashier-photo"
    data-photo-id="${x.id}"
    src=""
    alt="${esc(x.name)}"
   >

  </div>

  <div>

   <div class="item-title">
    ${index+1}. ${esc(x.name)}
   </div>

   <div class="price">
    ${rup(x.price)} / pcs
   </div>

   <div class="cashier-target">

    <div class="row">
     <span>Target Item</span>
     <b>${fmt(target)} pcs</b>
    </div>

    <div class="row">
     <span>Pembagi</span>
     <b>÷ ${fmt(divisor)}</b>
    </div>

    <div class="row">
     <span>Target Kasir</span>
     <b class="green">
      ${fmt(cashierTarget)} pcs
     </b>
    </div>

   </div>

  </div>

 </div>`;
}

function pengaturan(){

 const divisor=cashierDivisor();

 return `
 ${monthControls()}

 <div class="card">

  <h2>⚙️ Pengaturan</h2>

  <label>
   Pembagi Target Kasir
  </label>

  <input
   id="cashierDivisor"

   min="1"
   step="1"
   value="${divisor}"
  >

  <p class="muted">

   Contoh pembagi 3:<br>

   Target Aqua 60 pcs ÷ 3 =
   Target Kasir 20 pcs.

   <br><br>

   Pembagi ini bukan nama kasir
   dan tidak membuat data Orang 1/2/3.

  </p>

  <button
   class="primary"
   onclick="saveSettings()"
  >
   💾 Simpan Pengaturan
  </button>

 </div>

 <div class="card">

  <h2>ℹ️ Tentang Target</h2>

  <div class="info">

   <b>Target Toko</b><br>
   Menggunakan persentase target
   pencapaian per toko.

   <br><br>

   <b>Qty Harian</b><br>
   Actual pencapaian dapat dimasukkan
   setiap hari.

   <br><br>

   <b>Target Item</b><br>
   Target masing-masing produk
   dimasukkan pada Target Toko.

   <br><br>

   <b>Target Kasir</b><br>
   Otomatis mengambil target item
   lalu dibagi sesuai pembagi.

  </div>

 </div>`;
}

function saveSettings(){

 const v=Number(
  document.getElementById("cashierDivisor").value
 );

 if(!Number.isFinite(v)||v<1){

  alert("Pembagi minimal 1.");

  return;
 }

 db.settings.cashierDivisor=Math.round(v);

 save();
 render();

 toast("Pengaturan disimpan.");
}

/* =========================
   TOAST
========================= */

function toast(msg){

 const el=document.getElementById("toast");

 el.textContent=msg;
 el.style.display="block";

 clearTimeout(window.__toast);

 window.__toast=setTimeout(()=>{
  el.style.display="none";
 },2200);
}

/* =========================
   NAV BUTTON
========================= */

document
 .querySelectorAll(".nav button")
 .forEach(b=>{

  b.onclick=()=>{
   go(b.dataset.page);
  };

 });

/* =========================
   MIGRASI DATA LAMA
========================= */

(function migrate(){

 if(!db.weeks)db.weeks={};

 for(let w=1;w<=4;w++){

  const d=ensureWeek(w);

  d.items.forEach(x=>{

   if(!x.id){
    x.id=
     "item_"+Date.now()+"_"+
     Math.random().toString(36).slice(2,7);
   }

   if(!Number.isFinite(Number(x.price))){
    x.price=0;
   }

   /*
    Data versi lama mempunyai target item.
    Tetap dipertahankan sebagai target item.
   */

   if(!Number.isFinite(Number(x.target))){
    x.target=0;
   }

  });

 }

 save();

})();

/* =========================
   START
========================= */

render();

</script>
