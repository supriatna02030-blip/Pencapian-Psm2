<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#e30613">
<meta name="mobile-web-app-capable" content="yes">
<title>PSM Monitoring</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:#e30613;
  color:#fff;
  padding:16px 18px;
  position:sticky;
  top:0;
  z-index:20;
}
header h1{margin:0;font-size:21px}
header small{opacity:.9}

main{
  max-width:900px;
  margin:auto;
  padding:14px 14px 95px;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  z-index:30;
  box-shadow:0 -3px 12px #00000012;
}
.nav button{
  flex:1;
  border:0;
  background:#fff;
  padding:9px 2px;
  font-size:10px;
  color:#555;
}
.nav button.active{
  color:#e30613;
  font-weight:bold;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:15px;
  margin-bottom:13px;
  box-shadow:0 2px 8px #00000012;
}

h2{
  font-size:18px;
  margin:4px 0 12px;
}

h3{
  margin:4px 0 8px;
  font-size:15px;
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:12px;
}
.tabs button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:9px 13px;
  white-space:nowrap;
}
.tabs button.active{
  background:#e30613;
  color:#fff;
  border-color:#e30613;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  padding:12px;
  border-radius:11px;
  background:#f7f7f7;
}
.stat b{
  display:block;
  font-size:20px;
  margin-top:4px;
}

.red{color:#e30613}
.green{color:#149447}
.orange{color:#d98200}
.muted{color:#777;font-size:12px}
.empty{
  text-align:center;
  color:#888;
  padding:25px 15px;
}

input,select{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:14px;
  background:#fff;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin:9px 0 5px;
}

button{
  cursor:pointer;
}

button.primary{
  background:#e30613;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold;
}

button.yellow{
  background:#ffca05;
  color:#111;
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold;
}

button.secondary{
  background:#eee;
  border:0;
  border-radius:10px;
  padding:10px 13px;
}

button.danger{
  background:#ffe9e9;
  color:#e30613;
  border:0;
  border-radius:10px;
  padding:10px 13px;
  font-weight:bold;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}
.actions button{
  flex:1;
  min-width:90px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  margin:6px 0;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.monthbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.info{
  background:#fff7d6;
  border-left:4px solid #ffca05;
  padding:11px;
  border-radius:8px;
  font-size:13px;
}

.progress{
  height:9px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}
.progress i{
  display:block;
  height:100%;
  background:#e30613;
  border-radius:20px;
}

.product{
  border:1px solid #e8e8e8;
  border-radius:14px;
  padding:13px;
  margin:10px 0;
  background:#fff;
}

.product-number{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#e30613;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:12px;
  flex-shrink:0;
}

.product-title{
  font-size:15px;
  font-weight:bold;
}

.product-head{
  display:flex;
  align-items:center;
  gap:9px;
}

.price-list{
  margin-top:10px;
  border-top:1px solid #eee;
}

.price-row{
  display:grid;
  grid-template-columns:1fr 100px;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #eee;
  font-size:12px;
}

.price-row:last-child{
  border-bottom:0;
}

.actual-box{
  background:#f8f8f8;
  border-radius:11px;
  padding:10px;
  margin-top:10px;
}

.variant-input{
  display:grid;
  grid-template-columns:1fr 95px 90px;
  gap:7px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.variant-input:last-child{
  border-bottom:0;
}

.variant-input input{
  text-align:center;
  padding:8px;
}

.cashier-item{
  border:1px solid #eee;
  border-radius:13px;
  padding:13px;
  margin:10px 0;
}

.cashier-number{
  display:inline-flex;
  width:28px;
  height:28px;
  border-radius:8px;
  align-items:center;
  justify-content:center;
  background:#e30613;
  color:#fff;
  font-weight:bold;
  font-size:11px;
  margin-right:7px;
}

.totalbox{
  background:#fff;
  border:1px solid #eee;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  border-bottom:1px solid #eee;
  padding:9px 5px;
  text-align:left;
}
th{background:#fafafa}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:20px;
  background:#f3f3f3;
  font-size:10px;
  font-weight:bold;
}

.goodbg{background:#eaf8ef}
.badbg{background:#ffecec}
.yellowbg{background:#fff7d6}

.toast{
  position:fixed;
  left:50%;
  bottom:75px;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  font-size:12px;
  z-index:100;
  display:none;
  max-width:90%;
  text-align:center;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:#00000070;
  z-index:80;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal{
  background:#fff;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  border-radius:20px 20px 0 0;
  padding:18px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.close{
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:18px;
}

.form-row{
  margin-bottom:10px;
}

.hidden{display:none}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr 1fr;
  }
  .monthbar{
    grid-template-columns:1fr;
  }
  .variant-input{
    grid-template-columns:1fr 80px 80px;
  }
  .price-row{
    grid-template-columns:1fr 90px;
  }
}

@media print{
  header,.nav,.tabs,.monthbar,button{
    display:none!important;
  }
  main{
    padding:0;
  }
  .card{
    box-shadow:none;
    border:1px solid #ddd;
  }
}
</style>
</head>

<body>

<header>
  <h1>📊 PSM Monitoring</h1>
  <small>Produk Spesial Mingguan</small>
</header>

<main id="app"></main>

<nav class="nav">
  <button data-page="dashboard">🏠<br>Dashboard</button>
  <button data-page="toko">🎯<br>Target Toko</button>
  <button data-page="kasir">👤<br>Target Kasir</button>
  <button data-page="info">📋<br>Info Target</button>
  <button data-page="laporan">📈<br>Laporan</button>
  <button data-page="pengaturan">⚙️<br>Pengaturan</button>
</nav>

<div id="toast" class="toast"></div>

<div id="modalBg" class="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<script>

/* =========================================================
   PSM MONITORING
   SINGLE FILE VERSION
========================================================= */

const KEY='psm_monitoring_v3';

function freshDB(){
  const d=new Date();

  return {
    month:d.getMonth()+1,
    year:d.getFullYear(),

    settings:{
      cashierDivisor:3
    },

    weeks:{
      1:{
        items:[],
        daily:{},
        targetDaily:0
      },
      2:{
        items:[],
        daily:{},
        targetDaily:0
      },
      3:{
        items:[],
        daily:{},
        targetDaily:0
      },
      4:{
        items:[],
        daily:{},
        targetDaily:0
      }
    }
  };
}

function loadDB(){

  try{

    const old=JSON.parse(localStorage.getItem(KEY)||'null');

    if(old && typeof old==='object'){
      return migrateDB(old);
    }

    return freshDB();

  }catch(e){

    return freshDB();

  }

}

let db=loadDB();

let page='dashboard';
let week=1;
let selectedDate='';

function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
}

function migrateDB(x){

  const base=freshDB();

  if(x.month)base.month=x.month;
  if(x.year)base.year=x.year;

  if(x.settings){
    base.settings=Object.assign(
      base.settings,
      x.settings
    );
  }

  if(x.weeks){

    for(let w=1;w<=4;w++){

      const old=x.weeks[w];

      if(!old)continue;

      base.weeks[w]={
        items:Array.isArray(old.items)?old.items:[],
        daily:old.daily||{},
        targetDaily:Number(old.targetDaily||0)
      };

      base.weeks[w].items.forEach(item=>{

        if(!item.id){
          item.id='item_'+Date.now()+
          Math.random().toString(36).slice(2,7);
        }

        if(!Array.isArray(item.variants)){
          item.variants=[];
        }

        /*
          Format lama:
          variants = ["Regular","Coffee"]

          Format baru:
          variants = [
            {name:"Regular",price:4000},
            {name:"Coffee",price:7000}
          ]
        */

        item.variants=item.variants.map(v=>{

          if(typeof v==='string'){
            return {
              name:v,
              price:Number(item.price||0)
            };
          }

          return {
            name:v.name||'Variant',
            price:Number(v.price||item.price||0)
          };

        });

      });

    }

  }

  return base;
}

function ensureWeek(w=week){

  if(!db.weeks)db.weeks={};

  if(!db.weeks[w]){

    db.weeks[w]={
      items:[],
      daily:{},
      targetDaily:0
    };

  }

  if(!Array.isArray(db.weeks[w].items)){
    db.weeks[w].items=[];
  }

  if(!db.weeks[w].daily){
    db.weeks[w].daily={};
  }

  if(!Number.isFinite(Number(db.weeks[w].targetDaily))){
    db.weeks[w].targetDaily=0;
  }

  return db.weeks[w];
}

function data(){
  return ensureWeek(week);
}

function daysInWeek(w){

  const y=Number(db.year);
  const m=Number(db.month);

  const last=new Date(y,m,0).getDate();

  const ranges={
    1:[1,7],
    2:[8,15],
    3:[16,23],
    4:[24,last]
  };

  return ranges[w];
}

function weekDays(w=week){

  const r=daysInWeek(w);

  return r[1]-r[0]+1;
}

function monthText(){

  return new Date(
    Number(db.year),
    Number(db.month)-1,
    1
  ).toLocaleString(
    'id-ID',
    {month:'long'}
  ).toUpperCase();

}

function weekName(w){

  const r=daysInWeek(w);

  return `WEEK ${w} | ${
    String(r[0]).padStart(2,'0')
  }-${
    String(r[1]).padStart(2,'0')
  } ${monthText()} ${db.year}`;

}

function dateKey(day){

  return `${db.year}-${
    String(db.month).padStart(2,'0')
  }-${
    String(day).padStart(2,'0')
  }`;

}

function weekDates(w=week){

  const r=daysInWeek(w);
  const out=[];

  for(let d=r[0];d<=r[1];d++){
    out.push(dateKey(d));
  }

  return out;
}

function todayKey(){

  const d=new Date();

  return `${d.getFullYear()}-${
    String(d.getMonth()+1).padStart(2,'0')
  }-${
    String(d.getDate()).padStart(2,'0')
  }`;

}

function selectedDay(){

  const dates=weekDates();

  if(
    selectedDate &&
    dates.includes(selectedDate)
  ){
    return selectedDate;
  }

  const today=todayKey();

  if(dates.includes(today)){
    return today;
  }

  return dates[0];
}

function dateLabel(s){

  if(!s)return '-';

  const p=s.split('-').map(Number);

  return `${
    String(p[2]).padStart(2,'0')
  } ${
    new Date(
      p[0],
      p[1]-1,
      1
    ).toLocaleString(
      'id-ID',
      {month:'short'}
    )
  } ${p[0]}`;

}

function rup(n){

  return 'Rp'+Number(n||0)
    .toLocaleString('id-ID');

}

function fmt(n){

  return Number(n||0)
    .toLocaleString(
      'id-ID',
      {maximumFractionDigits:2}
    );

}

function pct(a,t){

  return t
    ?((Number(a||0)/Number(t||0))*100).toFixed(2)+'%'
    :'0%';

}

function esc(s){

  return String(s??'')
    .replace(
      /[&<>"']/g,
      c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

}

/* =========================================================
   TARGET TOKO
========================================================= */

/*
  SATU-SATUNYA TARGET YANG DIINPUT:
  TARGET KESELURUHAN TOKO PER HARI

  TIDAK ADA INPUT TARGET WEEK.
*/

function getDailyTarget(w=week){

  return Number(
    ensureWeek(w).targetDaily||0
  );

}

function setDailyTarget(){

  const old=getDailyTarget();

  const value=Number(
    prompt(
      `Target keseluruhan toko PER HARI\n\n${weekName(week)}\n\nMasukkan qty:`,
      old
    )
  );

  if(
    !Number.isFinite(value) ||
    value<0
  ){
    return;
  }

  data().targetDaily=value;

  save();
  render();

  toast(
    'Target keseluruhan per hari berhasil disimpan.'
  );

}

/*
  Target week hanya dihitung otomatis.
  BUKAN input user.
*/

function calculatedWeekTarget(w=week){

  return getDailyTarget(w)*weekDays(w);

}

/* =========================================================
   TARGET ITEM UNTUK KASIR
========================================================= */

/*
  Karena user tidak ingin memasukkan
  target toko per item, sistem membagi
  target harian secara otomatis ke semua
  produk yang terdaftar.

  Contoh:
  Target toko = 90
  Produk = 3

  Aqua = 30
  Le Mineral = 30
  Teh = 30

  Kemudian jika pembagi kasir = 3:

  Aqua = 10
  Le Mineral = 10
  Teh = 10
*/

function automaticItemTarget(itemCount){

  if(!itemCount)return 0;

  return getDailyTarget()/itemCount;

}

/* =========================================================
   PEMBAGI KASIR
========================================================= */

function cashierDivisor(){

  const n=Number(
    db.settings?.cashierDivisor
  );

  return (
    Number.isFinite(n) &&
    n>0
  )
  ?n
  :3;

}

/* =========================================================
   ACTUAL
========================================================= */

function actualOnDate(
  id,
  date,
  w=week
){

  const d=ensureWeek(w);

  return Number(
    d.daily?.[date]?.[id]?.total||0
  );

}

function actualItem(
  id,
  w=week
){

  const d=ensureWeek(w);

  let total=0;

  Object.values(d.daily||{}).forEach(day=>{

    total+=Number(
      day?.[id]?.total||0
    );

  });

  return total;

}

function totalActual(w=week){

  const d=ensureWeek(w);

  return d.items.reduce(
    (sum,item)=>
      sum+actualItem(item.id,w),
    0
  );

}

function dailyItemTotal(
  date,
  w=week
){

  const d=ensureWeek(w);

  return d.items.reduce(
    (sum,item)=>
      sum+actualOnDate(
        item.id,
        date,
        w
      ),
    0
  );

}

function totalTarget(w=week){

  return calculatedWeekTarget(w);

}

/* =========================================================
   VARIANT
========================================================= */

function variantPrice(item,index){

  const v=item.variants?.[index];

  if(!v)return Number(item.price||0);

  if(typeof v==='string'){
    return Number(item.price||0);
  }

  return Number(
    v.price||item.price||0
  );

}

function variantName(item,index){

  const v=item.variants?.[index];

  if(!v)return '';

  if(typeof v==='string')return v;

  return v.name||'Variant';

}

function variantActual(
  id,
  index,
  date,
  w=week
){

  const d=ensureWeek(w);

  return Number(
    d.daily?.[date]?.[id]?.variants?.[index]||0
  );

}

function variantWeeklyActual(
  id,
  index,
  w=week
){

  const dates=weekDates(w);

  let total=0;

  dates.forEach(date=>{

    total+=variantActual(
      id,
      index,
      date,
      w
    );

  });

  return total;

}

/* =========================================================
   TABS + MONTH
========================================================= */

function tabs(){

  return `
  <div class="tabs">

    ${[1,2,3,4].map(w=>`

      <button
        class="${week==w?'active':''}"
        onclick="setWeek(${w})"
      >
        Week ${w}
      </button>

    `).join('')}

  </div>`;

}

function monthControls(){

  return `
  <div class="monthbar">

    <div>
      <label>Bulan</label>

      <input
        type="month"
        value="${db.year}-${
          String(db.month).padStart(2,'0')
        }"
        onchange="changeMonth(this.value)"
      >

    </div>

    <div>
      <label>Week Aktif</label>

      <input
        value="${weekName(week)}"
        readonly
      >

    </div>

  </div>`;

}

function setWeek(w){

  week=Number(w);
  selectedDate='';

  render();

}

function changeMonth(v){

  if(!v)return;

  const p=v.split('-').map(Number);

  db.year=p[0];
  db.month=p[1];

  week=1;
  selectedDate='';

  save();
  render();

}

/* =========================================================
   RENDER
========================================================= */

function render(){

  const app=
    document.getElementById('app');

  if(page==='dashboard'){
    app.innerHTML=dashboard();
  }

  if(page==='toko'){
    app.innerHTML=toko();
  }

  if(page==='kasir'){
    app.innerHTML=kasir();
  }

  if(page==='info'){
    app.innerHTML=infoTarget();
  }

  if(page==='laporan'){
    app.innerHTML=laporan();
  }

  if(page==='pengaturan'){
    app.innerHTML=pengaturan();
  }

  document
    .querySelectorAll('.nav button')
    .forEach(button=>{
      button.classList.toggle(
        'active',
        button.dataset.page===page
      );
    });

}

/* =========================================================
   DASHBOARD
========================================================= */

function dashboard(){

  const target=totalTarget();
  const actual=totalActual();

  const acv=
    target
    ?actual/target*100
    :0;

  const daily=getDailyTarget();

  const today=selectedDay();

  const actualToday=
    dailyItemTotal(today);

  const remaining=
    Math.max(
      0,
      target-actual
    );

  const dates=weekDates();

  const currentIndex=
    Math.max(
      0,
      dates.indexOf(today)
    );

  const remainingDays=
    Math.max(
      0,
      dates.length-currentIndex-1
    );

  const needTomorrow=
    remainingDays
    ?remaining/remainingDays
    :0;

  return `

  ${monthControls()}
  ${tabs()}

  <div class="card">

    <h2>
      🏠 Dashboard
    </h2>

    <div class="muted">
      ${weekName(week)}
    </div>

    <br>

    <div class="grid">

      <div class="stat">
        Target / Hari
        <b>${fmt(daily)} pcs</b>
      </div>

      <div class="stat">
        Target Week
        <b>${fmt(target)} pcs</b>
      </div>

      <div class="stat">
        Actual Week
        <b class="green">${fmt(actual)} pcs</b>
      </div>

      <div class="stat">
        ACV
        <b class="${
          acv>=100
          ?'green'
          :acv>=80
          ?'orange'
          :'red'
        }">
          ${acv.toFixed(2)}%
        </b>
      </div>

    </div>

    <div class="progress">
      <i style="width:${Math.min(
        100,
        Math.max(0,acv)
      )}%"></i>
    </div>

  </div>


  <div class="card">

    <h2>📅 Hari Ini</h2>

    <div class="grid">

      <div class="stat">
        Tanggal
        <b>${dateLabel(today)}</b>
      </div>

      <div class="stat">
        Target
        <b>${fmt(daily)} pcs</b>

/* =========================================================
   NILAI ACTUAL
========================================================= */

function actualValueOnDate(
  id,
  date
){

  const item=
    data().items.find(
      x=>x.id===id
    );

  if(!item)return 0;

  if(item.variants?.length){

    return item.variants.reduce(
      (sum,v,i)=>{

        return sum+
          variantActual(
            id,
            i,
            date
          )*
          variantPrice(
            item,
            i
          );

      },
      0
    );

  }

  return actualOnDate(
    id,
    date
  )*Number(item.price||0);

}

function actualValueWeek(id){

  const item=
    data().items.find(
      x=>x.id===id
    );

  if(!item)return 0;

  return weekDates().reduce(
    (sum,date)=>
      sum+
      actualValueOnDate(
        id,
        date
      ),
    0
  );

}

function updateActualPreview(id){

  const item=
    data().items.find(
      x=>x.id===id
    );

  if(!item)return;

  let total=0;
  let value=0;

  if(item.variants?.length){

    document
      .querySelectorAll(
        '.actual-v-qty'
      )
      .forEach(input=>{

        const i=
          Number(
            input.dataset.index
          );

        const q=
          Number(input.value||0);

        total+=q;

        value+=
          q*
          variantPrice(
            item,
            i
          );

      });

  }else{

    total=
      Number(
        document
        .getElementById(
          'actualSimpleQty'
        )?.value||0
      );

    value=
      total*
      Number(item.price||0);

  }

  const preview=
    document.getElementById(
      'actualPreview'
    );

  if(preview){

    preview.innerHTML=`

      <div class="row">

        <span>
          Total Qty
        </span>

        <b>
          ${fmt(total)} pcs
        </b>

      </div>

      <div class="row">

        <span>
          Nilai Actual
        </span>

        <b>
          ${rup(value)}
        </b>

      </div>

    `;

  }

}

function saveActual(id){

  const item=
    data().items.find(
      x=>x.id===id
    );

  if(!item)return;

  const date=selectedDay();

  const d=data();

  if(!d.daily[date]){
    d.daily[date]={};
  }

  let total=0;

  const record={
    total:0,
    variants:[]
  };

  if(item.variants?.length){

    document
      .querySelectorAll(
        '.actual-v-qty'
      )
      .forEach(input=>{

        const q=Math.max(
          0,
          Number(input.value||0)
        );

        const i=
          Number(
            input.dataset.index
          );

        record.variants[i]=q;

        total+=q;

      });

  }else{

    total=Math.max(
      0,
      Number(
        document
        .getElementById(
          'actualSimpleQty'
        )
        .value||0
      )
    );

  }

  record.total=total;

  d.daily[date][id]=record;

  save();
  closeModal();
  render();

  toast(
    'Actual berhasil disimpan.'
  );

}

function weekReport(w){

  const target=
    totalTarget(w);

  const actual=
    totalActual(w);

  const acv=
    target
    ?actual/target*100
    :0;

  return {
    target,
    actual,
    diff:actual-target,
    acv
  };

}

function monthlyReport(){

  let target=0;
  let actual=0;

  for(let w=1;w<=4;w++){

    target+=
      totalTarget(w);

    actual+=
      totalActual(w);

  }

  return {

    target,
    actual,
    diff:actual-target,
    acv:
      target
      ?actual/target*100
      :0

  };

}

function saveSettings(){

  const value=
    Number(
      document
      .getElementById(
        'settingDivisor'
      )
      .value
    );

  if(
    !Number.isFinite(value) ||
    value<1
  ){

    alert(
      'Pembagi minimal 1.'
    );

    return;

  }

  if(!db.settings){
    db.settings={};
  }

  db.settings.cashierDivisor=
    Math.round(value);

  save();
  render();

  toast(
    'Pembagi Target Kasir berhasil disimpan.'
  );

}

function saveDailySetting(){

  const value=
    Number(
      document
      .getElementById(
        'settingDailyTarget'
      )
      .value
    );

  if(
    !Number.isFinite(value) ||
    value<0
  ){

    alert(
      'Target harian tidak valid.'
    );

    return;

  }

  data().targetDaily=value;

  save();
  render();

  toast(
    'Target keseluruhan per hari berhasil disimpan.'
  );

}

/* =========================================================
   BACKUP
========================================================= */

function backupData(){

  const content=
    JSON.stringify(
      db,
      null,
      2
    );

  const blob=
    new Blob(
      [content],
      {type:'application/json'}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement('a');

  a.href=url;

  a.download=
    `PSM-Backup-${
      db.year
    }-${
      String(db.month).padStart(2,'0')
    }.json`;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  toast(
    'Backup data berhasil dibuat.'
  );

}

function restoreData(event){

  const file=
    event.target.files?.[0];

  if(!file)return;

  const reader=
    new FileReader();

  reader.onload=function(){

    try{

      const restored=
        JSON.parse(
          reader.result
        );

      if(
        !restored ||
        typeof restored!=='object' ||
        !restored.weeks
      ){

        throw new Error(
          'Format backup tidak valid.'
        );

      }

      if(!confirm(
        'Restore akan mengganti data yang sekarang. Lanjutkan?'
      )){

        event.target.value='';
        return;

      }

      db=
        migrateDB(
          restored
        );

      save();
      render();

      toast(
        'Data berhasil di-restore.'
      );

    }catch(e){

      alert(
        'File backup tidak valid.'
      );

    }

    event.target.value='';

  };

  reader.readAsText(file);

}

function resetAllData(){

  if(!confirm(
    'Yakin ingin menghapus SEMUA data PSM dari perangkat ini?'
  )){
    return;
  }

  if(!confirm(
    'Data yang sudah dihapus tidak bisa dikembalikan tanpa backup.'
  )){
    return;
  }

  db=freshDB();

  save();

  page='dashboard';
  week=1;
  selectedDate='';

  render();

  toast(
    'Semua data berhasil dihapus.'
  );

}

/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const el=
    document.getElementById(
      'toast'
    );

  el.textContent=message;
  el.style.display='block';

  clearTimeout(
    window.__toast
  );

  window.__toast=
    setTimeout(
      ()=>{
        el.style.display='none';
      },
      2300
    );

}
