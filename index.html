<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#e30613">
<title>PSM Monitoring</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f5f5;
 color:#222
}
header{
 background:#e30613;
 color:#fff;
 padding:16px 18px;
 position:sticky;
 top:0;
 z-index:5
}
header h1{margin:0;font-size:21px}
header small{opacity:.9}

main{
 max-width:900px;
 margin:auto;
 padding:14px 14px 90px
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#fff;
 border-top:1px solid #ddd;
 display:flex;
 z-index:10;
 overflow-x:auto
}
.nav button{
 flex:1;
 min-width:70px;
 border:0;
 background:white;
 padding:9px 2px;
 font-size:10px;
 color:#555
}
.nav button.active{
 color:#e30613;
 font-weight:bold
}

.card{
 background:#fff;
 border-radius:14px;
 padding:15px;
 margin-bottom:13px;
 box-shadow:0 2px 8px #00000012
}

h2{
 font-size:18px;
 margin:4px 0 12px
}

.tabs{
 display:flex;
 gap:7px;
 overflow:auto;
 margin-bottom:12px
}
.tabs button{
 border:1px solid #ddd;
 background:#fff;
 border-radius:10px;
 padding:9px 13px;
 white-space:nowrap
}
.tabs button.active{
 background:#e30613;
 color:#fff;
 border-color:#e30613
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.stat{
 padding:12px;
 border-radius:11px;
 background:#f7f7f7
}
.stat b{
 display:block;
 font-size:20px;
 margin-top:4px
}

.red{color:#e30613}
.green{color:#149447}
.orange{color:#d98200}

.item{
 border:1px solid #eee;
 border-radius:13px;
 padding:12px;
 margin:10px 0;
 background:#fff
}

.item-number{
 width:28px;
 height:28px;
 border-radius:50%;
 background:#e30613;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 flex:none
}

.item-title{
 font-weight:bold;
 font-size:15px
}

.row{
 display:flex;
 justify-content:space-between;
 gap:8px;
 align-items:center;
 margin:7px 0
}

input,select{
 width:100%;
 padding:10px;
 border:1px solid #ccc;
 border-radius:9px;
 font-size:14px
}

label{
 display:block;
 font-size:12px;
 font-weight:bold;
 margin:9px 0 5px
}

button.primary{
 background:#e30613;
 color:white;
 border:0;
 border-radius:10px;
 padding:11px 14px;
 font-weight:bold
}

button.yellow{
 background:#ffca05;
 color:#111;
 border:0;
 border-radius:10px;
 padding:11px 14px;
 font-weight:bold
}

button.secondary{
 background:#eee;
 border:0;
 border-radius:10px;
 padding:10px 13px
}

button.danger{
 background:#ffe9e9;
 color:#e30613;
 border:0;
 border-radius:10px;
 padding:10px 13px;
 font-weight:bold
}

.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-top:10px
}
.actions button{
 flex:1;
 min-width:90px
}

table{
 width:100%;
 border-collapse:collapse;
 font-size:13px
}
th,td{
 border-bottom:1px solid #eee;
 padding:9px 5px;
 text-align:left
}
th{background:#fafafa}

.muted{
 color:#777;
 font-size:12px
}

.empty{
 text-align:center;
 color:#888;
 padding:20px
}

.info{
 background:#fff7d6;
 border-left:4px solid #ffca05;
 padding:11px;
 border-radius:8px;
 font-size:13px
}

.progress{
 height:10px;
 background:#eee;
 border-radius:20px;
 overflow:hidden;
 margin-top:8px
}

.progress i{
 display:block;
 height:100%;
 background:#e30613;
 border-radius:20px
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 background:#eee;
 font-size:10px;
 font-weight:bold
}

.goodbg{background:#eaf8ef}
.badbg{background:#ffecec}
.yellowbg{background:#fff7d6}

.photo{
 width:70px;
 height:70px;
 border-radius:12px;
 object-fit:cover;
 background:#eee;
 border:1px solid #ddd
}

.photo-large{
 width:110px;
 height:110px;
 border-radius:14px;
 object-fit:cover;
 background:#eee;
 border:1px solid #ddd
}

.product-head{
 display:flex;
 align-items:center;
 gap:10px
}

.totalbox{
 background:#fff;
 border:1px solid #eee;
 border-radius:12px;
 padding:12px;
 margin-top:10px
}

.datebar{
 display:grid;
 grid-template-columns:1fr;
 gap:8px;
 margin-bottom:12px
}

.acv-big{
 font-size:25px;
 font-weight:bold
}

.hr{
 border:0;
 border-top:1px solid #eee;
 margin:14px 0
}

.toast{
 position:fixed;
 left:50%;
 bottom:75px;
 transform:translateX(-50%);
 background:#222;
 color:#fff;
 padding:10px 15px;
 border-radius:10px;
 font-size:12px;
 z-index:50;
 display:none
}

@media(max-width:600px){
 .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>
 <h1>📊 PSM Monitoring</h1>
 <small>Produk Spesial Mingguan</small>
</header>

<main id="app"></main>

<nav class="nav">
 <button data-page="dashboard">🏠<br>Dashboard</button>
 <button data-page="toko">🎯<br>Target Toko</button>
 <button data-page="kasir">👤<br>Target Kasir</button>
 <button data-page="info">📋<br>Info Target</button>
 <button data-page="laporan">📈<br>Laporan</button>
 <button data-page="pengaturan">⚙️<br>Pengaturan</button>
</nav>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   PSM MONITORING
   ========================================================= */

const KEY="psm_monitoring_final_v1";

function freshDB(){
 const d=new Date();

 return {
  month:d.getMonth()+1,
  year:d.getFullYear(),
  settings:{
   cashierDivisor:3
  },
  weeks:{}
 };
}

function loadDB(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY)||"null");
  return x && typeof x==="object" ? x : freshDB();
 }catch(e){
  return freshDB();
 }
}

let db=loadDB();
let page="dashboard";
let week=1;
let selectedDate="";

function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
}

function ensureDB(){

 if(!db.settings){
  db.settings={cashierDivisor:3};
 }

 if(!db.settings.cashierDivisor){
  db.settings.cashierDivisor=3;
 }

 if(!db.weeks){
  db.weeks={};
 }

 for(let w=1;w<=4;w++){

  if(!db.weeks[w]){
   db.weeks[w]={
    target:0,
    items:[],
    daily:{},
    cashierDaily:{}
   };
  }

  const d=db.weeks[w];

  if(!Array.isArray(d.items))d.items=[];
  if(!d.daily)d.daily={};
  if(!d.cashierDaily)d.cashierDaily={};

  d.items.forEach(x=>{
   if(!x.id)x.id="item_"+Date.now()+Math.random();
   if(!Array.isArray(x.variants))x.variants=[];
   if(typeof x.price!=="number")x.price=0;
   if(typeof x.target!=="number")x.target=0;
   if(!x.photo)x.photo="";
  });
 }
}

ensureDB();
save();


/* =========================
   BASIC
========================= */

function data(){
 return db.weeks[week];
}

function daysInWeek(w=week){

 const y=Number(db.year);
 const m=Number(db.month);

 const last=new Date(y,m,0).getDate();

 const ranges={
  1:[1,7],
  2:[8,15],
  3:[16,23],
  4:[24,last]
 };

 return ranges[w];
}

function weekDays(w=week){

 const r=daysInWeek(w);

 return r[1]-r[0]+1;
}

function monthName(){

 return new Date(
  Number(db.year),
  Number(db.month)-1,
  1
 ).toLocaleString(
  "id-ID",
  {month:"long"}
 ).toUpperCase();
}

function weekName(w=week){

 const r=daysInWeek(w);

 return `WEEK ${w} | ${String(r[0]).padStart(2,"0")}-${String(r[1]).padStart(2,"0")} ${monthName()} ${db.year}`;
}

function dateKey(day){

 return `${db.year}-${String(db.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

function weekDates(w=week){

 const r=daysInWeek(w);
 const arr=[];

 for(let d=r[0];d<=r[1];d++){
  arr.push(dateKey(d));
 }

 return arr;
}

function todayKey(){

 const d=new Date();

 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function selectedDay(){

 const dates=weekDates();

 if(selectedDate && dates.includes(selectedDate)){
  return selectedDate;
 }

 const t=todayKey();

 if(dates.includes(t)){
  return t;
 }

 return dates[0];
}

function dateLabel(s){

 if(!s)return "-";

 const p=s.split("-").map(Number);

 return `${String(p[2]).padStart(2,"0")} ${new Date(p[0],p[1]-1,1).toLocaleString("id-ID",{month:"short"})} ${p[0]}`;
}

function rup(n){

 return "Rp"+Number(n||0).toLocaleString("id-ID");
}

function fmt(n){

 return Number(n||0).toLocaleString(
  "id-ID",
  {maximumFractionDigits:2}
 );
}

function pct(a,t){

 return Number(t)>0
  ? ((Number(a||0)/Number(t))*100).toFixed(2)+"%"
  : "0.00%";
}

function esc(s){

 return String(s??"").replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c])
 );
}


/* =========================
   TARGET
========================= */

function targetWeek(){

 return Number(data().target||0);
}

function targetDaily(){

 return targetWeek()/7;
}

function totalActual(){

 let total=0;

 weekDates().forEach(dt=>{
  total+=dailyTotal(dt);
 });

 return total;
}

function dailyTotal(date){

 const d=data().daily[date]||{};

 return Object.keys(d).reduce(
  (sum,id)=>sum+Number(d[id]||0),
  0
 );
}

function actualItem(id){

 let total=0;

 weekDates().forEach(dt=>{
  total+=Number(
   data().daily[dt]?.[id]||0
  );
 });

 return total;
}

function actualItemDay(id,date){

 return Number(
  data().daily[date]?.[id]||0
 );
}

function targetItemDaily(x){

 return Number(x.target||0)/7;
}

function cashierDivisor(){

 const n=Number(
  db.settings?.cashierDivisor
 );

 return n>0?n:3;
}

function cashierTarget(){

 return targetWeek()/cashierDivisor();
}

function cashierTargetDaily(){

 return targetDaily()/cashierDivisor();
}


/* =========================
   NAV
========================= */

function go(p){

 page=p;
 render();
}

function setWeek(w){

 week=Number(w);
 selectedDate="";
 render();
}

function changeMonth(v){

 if(!v)return;

 const p=v.split("-").map(Number);

 db.year=p[0];
 db.month=p[1];

 week=1;
 selectedDate="";

 save();
 render();
}

function changeDate(v){

 selectedDate=v;
 render();
}

function render(){

 ensureDB();

 const app=document.getElementById("app");

 if(page==="dashboard"){
  app.innerHTML=dashboard();
 }

 if(page==="toko"){
  app.innerHTML=toko();
 }

 if(page==="kasir"){
  app.innerHTML=kasir();
 }

 if(page==="info"){
  app.innerHTML=infoTarget();
 }

 if(page==="laporan"){
  app.innerHTML=laporan();
 }

 if(page==="pengaturan"){
  app.innerHTML=pengaturan();
 }

 document.querySelectorAll(".nav button")
 .forEach(b=>{
  b.classList.toggle(
   "active",
   b.dataset.page===page
  );
 });
}

function monthControls(){

 return `
 <div class="card">
  <div class="grid">
   <div>
    <label>Bulan</label>
    <input
     type="month"
     value="${db.year}-${String(db.month).padStart(2,"0")}"
     onchange="changeMonth(this.value)"
    >
   </div>

   <div>
    <label>Week Aktif</label>
    <select onchange="setWeek(this.value)">
     ${[1,2,3,4].map(w=>`
      <option value="${w}" ${week===w?"selected":""}>
       Week ${w}
      </option>
     `).join("")}
    </select>
   </div>
  </div>
 </div>
 `;
}

function tabs(){

 return `
 <div class="tabs">
  ${[1,2,3,4].map(w=>`
   <button
    class="${week===w?"active":""}"
    onclick="setWeek(${w})"
   >
    Week ${w}
   </button>
  `).join("")}
 </div>
 `;
}

function dateSelector(){

 const dates=weekDates();

 return `
 <div class="card datebar">

  <div>
   <label>📅 Tanggal Pencapaian</label>

   <input
    type="date"
    value="${selectedDay()}"
    min="${dates[0]}"
    max="${dates[dates.length-1]}"
    onchange="changeDate(this.value)"
   >
  </div>

  <div class="muted">
   ${weekName()} • ${dateLabel(selectedDay())}
  </div>

 </div>
 `;
}


/* =========================
   DASHBOARD
========================= */

function dashboard(){

 const target=targetWeek();
 const actual=totalActual();
 const acv=target>0?(actual/target)*100:0;

 return `
 ${monthControls()}
 ${tabs()}
 ${dateSelector()}

 <div class="card">

  <h2>🏠 Dashboard</h2>

  <div class="info">
   <b>${weekName()}</b>
  </div>

  <br>

  <div class="grid">

   <div class="stat">
    Target Week
    <b>${fmt(target)} pcs</b>
   </div>

   <div class="stat">
    Target / Hari
    <b>${fmt(targetDaily())} pcs</b>
   </div>

   <div class="stat">
    Actual Week
    <b class="green">${fmt(actual)} pcs</b>
   </div>

   <div class="stat">
    ACV
    <b class="${acv>=100?"green":acv>=80?"orange":"red"}">
     ${acv.toFixed(2)}%
    </b>
   </div>

  </div>

  <div class="progress">
   <i style="width:${Math.min(100,Math.max(0,acv))}%"></i>
  </div>

 </div>


 <div class="card">

  <h2>📅 Pencapaian Hari Ini</h2>

  ${dailyBox(selectedDay())}

 </div>


 <div class="card">

  <h2>📦 Produk</h2>

  ${
   data().items.length
   ?
   data().items.map((x,i)=>{

    const a=actualItem(x.id);
    const ad=actualItemDay(x.id,selectedDay());

    return `
     <div class="item">

      <div class="product-head">

       ${
        x.photo
        ?
        `<img class="photo" src="${x.photo}">`
        :
        `<div class="photo"></div>`
       }

       <div>
        <div class="item-title">
         ${i+1}. ${esc(x.name)}
        </div>

        <div class="muted">
         ${rup(x.price)} / pcs
        </div>
       </div>

      </div>

      <hr class="hr">

      <div class="row">
       <span>Actual Week</span>
       <b>${fmt(a)} pcs</b>
      </div>

      <div class="row">
       <span>Actual Hari Ini</span>
       <b class="green">${fmt(ad)} pcs</b>
      </div>

     </div>
    `;

   }).join("")
   :
   `<div class="empty">
    Belum ada produk.
   </div>`
  }

 </div>
 `;
}


/* =========================
   DAILY BOX
========================= */

function dailyBox(date){

 const target=targetDaily();
 const actual=dailyTotal(date);
 const acv=target>0?(actual/target)*100:0;
 const diff=actual-target;

 return `
 <div class="grid">

  <div class="stat">
   Target
   <b>${fmt(target)} pcs</b>
  </div>

  <div class="stat">
   Pencapaian
   <b class="green">${fmt(actual)} pcs</b>
  </div>

  <div class="stat">
   ACV
   <b class="${acv>=100?"green":acv>=80?"orange":"red"}">
    ${acv.toFixed(2)}%
   </b>
  </div>

  <div class="stat">
   ${diff>=0?"Lebih":"Kurang"}
   <b class="${diff>=0?"green":"red"}">
    ${fmt(Math.abs(diff))} pcs
   </b>
  </div>

 </div>

 <div class="progress">
  <i style="width:${Math.min(100,Math.max(0,acv))}%"></i>
 </div>

 <p class="muted">
  ${dateLabel(date)}
 </p>
 `;
}


/* =========================
   TARGET TOKO
========================= */

function toko(){

 return `
 ${monthControls()}
 ${tabs()}
 ${dateSelector()}

 <div class="card">

  <h2>🎯 Target Pencapaian Toko</h2>

  <div class="info">
   Masukkan <b>target pencapaian toko untuk 1 Week</b>.
   Sistem otomatis menghitung target per hari berdasarkan
   <b>7 hari</b>.
  </div>

  <br>

  <label>Target Pencapaian Toko / Week</label>

  <input
   id="storeTarget"
   type="number"
   min="0"
   step="0.01"
   value="${targetWeek()}"
   placeholder="Contoh: 390"
  >

  <button
   class="primary"
   style="margin-top:10px"
   onclick="saveStoreTarget()"
  >
   💾 Simpan Target Toko
  </button>

  <div class="grid" style="margin-top:12px">

   <div class="stat">
    Target Week
    <b>${fmt(targetWeek())} pcs</b>
   </div>

   <div class="stat">
    Target / Hari
    <b>${fmt(targetDaily())} pcs</b>
   </div>

  </div>

 </div>


 <div class="card">

  <h2>📅 Pencapaian Toko</h2>

  ${dailyBox(selectedDay())}

  <button
   class="yellow"
   onclick="inputStoreAchievement()"
  >
   ✏️ Input Pencapaian Hari Ini
  </button>

 </div>


 <div class="card">

  <div class="row">
   <h2 style="margin:0">
    📦 Daftar Produk
   </h2>

   <button
    class="primary"
    onclick="addItem()"
   >
    ＋ Produk
   </button>
  </div>

  <div class="muted">
   Produk diberi nomor otomatis. Target per item dapat diatur
   secara terpisah.
  </div>

  ${
   data().items.length
   ?
   data().items.map(itemCard).join("")
   :
   `<div class="empty">
    Belum ada produk.
   </div>`
  }

 </div>
 `;
}

function itemCard(x,i){

 const ad=actualItemDay(x.id,selectedDay());
 const target=x.target||0;
 const targetDay=targetItemDaily(x);

 return `
 <div class="item">

  <div class="product-head">

   ${
    x.photo
    ?
    `<img class="photo" src="${x.photo}">`
    :
    `<div class="photo"></div>`
   }

   <div style="flex:1">

    <div class="row">

     <div class="item-title">
      ${i+1}. ${esc(x.name)}
     </div>

     <span class="badge">
      ${rup(x.price)}
     </span>

    </div>

    <div class="muted">
     Harga produk terpisah.
    </div>

   </div>

  </div>

  <hr class="hr">

  <div class="grid">

   <div class="stat">
    Target Item / Week
    <b>${fmt(target)} pcs</b>
   </div>

   <div class="stat">
    Target Item / Hari
    <b>${fmt(targetDay)} pcs</b>
   </div>

  </div>

  <div class="row">
   <span>Pencapaian Hari Ini</span>
   <b class="green">${fmt(ad)} pcs</b>
  </div>

  ${
   x.variants?.length
   ?
   `<div class="muted">
    Variant: ${x.variants.map(esc).join(" • ")}
   </div>`
   :
   ""
  }

  <div class="actions">

   <button
    class="primary"
    onclick="inputItemAchievement('${x.id}')"
   >
    Input
   </button>

   <button
    class="secondary"
    onclick="editItem('${x.id}')"
   >
    Edit
   </button>

   <button
    class="danger"
    onclick="deleteItem('${x.id}')"
   >
    Hapus
   </button>

  </div>

 </div>
 `;
}


/* =========================
   STORE TARGET
========================= */

function saveStoreTarget(){

 const v=Number(
  document.getElementById("storeTarget").value
 );

 if(!Number.isFinite(v)||v<0){
  alert("Target tidak valid.");
  return;
 }

 data().target=v;

 save();
 render();

 toast("Target toko berhasil disimpan.");
}

function inputStoreAchievement(){

 const date=selectedDay();

 const old=dailyTotal(date);

 const v=Number(
  prompt(
   `Pencapaian toko pada ${dateLabel(date)} (qty):`,
   old
  )
 );

 if(!Number.isFinite(v)||v<0)return;

 /*
  Pencapaian toko disimpan sebagai distribusi
  ke produk secara proporsional jika produk sudah ada.
 */

 if(!data().items.length){

  alert("Tambahkan produk terlebih dahulu.");
  return;
 }

 if(!data().daily[date]){
  data().daily[date]={};
 }

 if(old>0){

  const ratio=v/old;

  data().items.forEach(x=>{
   const oldItem=Number(
    data().daily[date][x.id]||0
   );

   data().daily[date][x.id]=
    Math.max(0,oldItem*ratio);
  });

 }else{

  /*
   Jika belum ada actual item,
   input pencapaian toko ditempatkan
   pada item pertama.
  */

  const first=data().items[0];

  data().daily[date][first.id]=v;
 }

 save();
 render();

 toast("Pencapaian toko berhasil disimpan.");
}


/* =========================
   ADD PRODUCT
========================= */

function addItem(){

 const name=prompt("Nama produk/item:");

 if(!name)return;

 const price=Number(
  prompt(
   `Harga ${name.trim()} per pcs (Rp):`,
   "0"
  )
 )||0;

 const target=Number(
  prompt(
   `Target ${name.trim()} / Week (qty):`,

function weekReport(w){

 const oldWeek=week;

 week=w;

 const target=targetWeek();

 const actual=totalActual();

 week=oldWeek;

 const acv=target>0
  ?actual/target*100
  :0;

 const diff=actual-target;

 return {
  target,
  actual,
  acv,
  diff
 };
}

function monthlyReport(){

 let target=0;
 let actual=0;

 for(let w=1;w<=4;w++){

  const r=weekReport(w);

  target+=r.target;
  actual+=r.actual;
 }

 const acv=target>0
  ?actual/target*100
  :0;

 return {
  target,
  actual,
  acv,
  diff:actual-target
 };
}

function savePhoto(id,file){

 if(!file)return;

 const reader=new FileReader();

 reader.onload=function(e){

  const x=data().items.find(
   i=>i.id===id
  );

  if(!x)return;

  /*
   Ukuran gambar diperkecil agar
   localStorage tidak cepat penuh.
  */

  resizeImage(
   e.target.result,
   500,
   function(result){

    x.photo=result;

    save();

    render();

    toast("Foto produk berhasil disimpan.");

   }
  );
 };

 reader.readAsDataURL(file);
}

function resizeImage(src,maxSize,callback){

 const img=new Image();

 img.onload=function(){

  let w=img.width;
  let h=img.height;

  if(w>maxSize || h>maxSize){

   if(w>h){

    h=Math.round(
     h*maxSize/w
    );

    w=maxSize;

   }else{

    w=Math.round(
     w*maxSize/h
    );

    h=maxSize;

   }

  }

  const canvas=document.createElement("canvas");

  canvas.width=w;
  canvas.height=h;

  const ctx=canvas.getContext("2d");

  ctx.drawImage(
   img,
   0,
   0,
   w,
   h
  );

  callback(
   canvas.toDataURL(
    "image/jpeg",
    .75
   )
  );
 };

 img.src=src;
}

/* =========================
   TOAST
========================= */

function toast(msg){

 const el=document.getElementById("toast");

 el.textContent=msg;

 el.style.display="block";

 clearTimeout(window.__toast);

 window.__toast=setTimeout(
  ()=>el.style.display="none",
  2200
 );
}

document.querySelectorAll(".nav button")
.forEach(b=>{

 b.onclick=()=>{
  go(b.dataset.page);
 };

});

render();
