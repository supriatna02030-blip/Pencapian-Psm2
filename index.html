<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#e30613">
<title>PSM Monitoring</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
  padding-bottom:75px
}

header{
  background:#e30613;
  color:#fff;
  padding:18px 18px 16px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 8px #0002
}

header h1{
  margin:0;
  font-size:22px
}

header small{
  opacity:.9;
  display:block;
  margin-top:4px
}

main{
  max-width:1000px;
  margin:auto;
  padding:14px 13px 30px
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  z-index:50;
  box-shadow:0 -2px 10px #00000010
}

.nav button{
  flex:1;
  border:0;
  background:#fff;
  padding:9px 2px 8px;
  font-size:10px;
  color:#666
}

.nav button.active{
  color:#e30613;
  font-weight:bold
}

.card{
  background:#fff;
  border-radius:17px;
  padding:15px;
  margin-bottom:13px;
  box-shadow:0 2px 10px #0000000d
}

h2{
  font-size:18px;
  margin:3px 0 12px
}

h3{
  margin:4px 0 8px
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:12px
}

.tabs button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:11px;
  padding:9px 15px;
  white-space:nowrap
}

.tabs button.active{
  background:#e30613;
  color:#fff;
  border-color:#e30613
}

.monthbar{
  margin-bottom:12px
}

.monthbar label{
  margin-top:0
}

.monthbar input{
  background:#fff
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.stat{
  padding:13px;
  border-radius:13px;
  background:#f7f7f7
}

.stat b{
  display:block;
  font-size:21px;
  margin-top:5px
}

.red{color:#e30613}
.green{color:#149447}
.orange{color:#d98200}
.blue{color:#125bd1}
.purple{color:#6834c7}

.muted{
  color:#777;
  font-size:12px
}

.small{
  font-size:11px
}

.empty{
  text-align:center;
  color:#888;
  padding:25px 10px
}

.info{
  background:#fff7d6;
  border-left:4px solid #ffca05;
  padding:11px;
  border-radius:9px;
  font-size:13px
}

.success{
  background:#eaf8ef;
  border-left:4px solid #149447;
  padding:11px;
  border-radius:9px;
  font-size:13px
}

input,
select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:14px;
  background:#fff
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin:10px 0 5px
}

button{
  cursor:pointer
}

button.primary{
  background:#e30613;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold
}

button.yellow{
  background:#ffca05;
  color:#111;
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold
}

button.secondary{
  background:#eee;
  border:0;
  border-radius:10px;
  padding:10px 13px
}

button.danger{
  background:#ffe9e9;
  color:#e30613;
  border:0;
  border-radius:10px;
  padding:10px 13px;
  font-weight:bold
}

button.bluebtn{
  background:#eaf2ff;
  color:#125bd1;
  border:0;
  border-radius:10px;
  padding:10px 13px;
  font-weight:bold
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px
}

.actions button{
  flex:1;
  min-width:100px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  margin:6px 0
}

.item{
  border:1px solid #eee;
  border-radius:14px;
  padding:13px;
  margin:10px 0;
  background:#fff
}

.item-title{
  font-weight:bold;
  font-size:15px
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#f1f1f1;
  font-size:10px;
  font-weight:bold
}

.goodbg{background:#eaf8ef}
.badbg{background:#ffecec}
.yellowbg{background:#fff7d6}

.progress{
  height:11px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin-top:9px
}

.progress i{
  display:block;
  height:100%;
  border-radius:20px;
  background:#e30613
}

.progress.greenbar i{
  background:#149447
}

.progress.purplebar i{
  background:#6834c7
}

.totalbox{
  background:#fff;
  border:1px solid #eee;
  border-radius:13px;
  padding:12px;
  margin-top:10px
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px
}

th,td{
  border-bottom:1px solid #eee;
  padding:9px 5px;
  text-align:left;
  vertical-align:middle
}

th{
  background:#fafafa
}

.product-photo{
  width:54px;
  height:54px;
  border-radius:11px;
  object-fit:cover;
  background:#eee;
  display:block
}

.photo-empty{
  width:54px;
  height:54px;
  border-radius:11px;
  background:#f2f2f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px
}

.home-main{
  border:1px solid #eee;
  overflow:hidden
}

.home-title{
  display:flex;
  gap:10px;
  align-items:center
}

.home-icon{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#fff0f0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  flex-shrink:0
}

.big-acv{
  font-size:28px!important
}

.date-select{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end
}

.date-select button{
  height:42px
}

.daily-card{
  border:1px solid #cfe0ff;
  background:linear-gradient(180deg,#f7fbff,#fff)
}

.cashier-card{
  border:1px solid #e5d8ff;
  background:linear-gradient(180deg,#fcf9ff,#fff)
}

.summary-card{
  background:#fffaf0;
  border:1px solid #f5e2b7
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.quick{
  background:#fff;
  border-radius:12px;
  padding:10px;
  text-align:center;
  border:1px solid #eee
}

.quick span{
  display:block;
  font-size:11px;
  color:#777
}

.quick b{
  display:block;
  font-size:18px;
  margin-top:4px
}

.product-mini{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:8px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid #eee
}

.product-mini:last-child{
  border-bottom:0
}

.day-list{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px
}

.day-box{
  border:1px solid #eee;
  border-radius:10px;
  padding:8px 4px;
  text-align:center;
  font-size:10px;
  background:#fff
}

.day-box.active{
  border:2px solid #149447;
  background:#effaf2
}

.day-box.bad{
  background:#fff1f1
}

.day-box.good{
  background:#effaf2
}

.form-row{
  margin-bottom:10px
}

.hr{
  border:0;
  border-top:1px solid #eee;
  margin:13px 0
}

.toast{
  position:fixed;
  left:50%;
  bottom:78px;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  font-size:12px;
  z-index:100;
  display:none
}

.hidden{
  display:none
}

@media(max-width:700px){
  .quick-grid{
    grid-template-columns:1fr 1fr
  }

  .day-list{
    grid-template-columns:repeat(4,1fr)
  }
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr 1fr
  }

  table{
    font-size:11px
  }

  th,td{
    padding:8px 4px
  }

  .actions button{
    min-width:85px
  }
}
</style>
</head>

<body>

<header>
  <h1>📊 PSM Monitoring</h1>
  <small>Produk Spesial Mingguan</small>
</header>

<main id="app"></main>

<nav class="nav">
  <button data-page="dashboard">🏠<br>Home</button>
  <button data-page="produk">📦<br>Produk</button>
  <button data-page="kasir">👤<br>Target Kasir</button>
  <button data-page="laporan">📈<br>Laporan</button>
  <button data-page="info">📋<br>Info Target</button>
  <button data-page="pengaturan">⚙️<br>Pengaturan</button>
</nav>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   PSM MONITORING FINAL
========================================================= */

const KEY='psm_monitoring_final_v5';

function freshDB(){
  const d=new Date();

  return {
    month:d.getMonth()+1,
    year:d.getFullYear(),

    settings:{
      cashierDivisor:3,
      dailyTarget:0
    },

    weeks:{
      1:{items:[],actual:{},daily:{}},
      2:{items:[],actual:{},daily:{}},
      3:{items:[],actual:{},daily:{}},
      4:{items:[],actual:{},daily:{}}
    }
  };
}

let db=loadDB();
let page='dashboard';
let week=1;
let selectedDate='';

function loadDB(){

  try{

    const old=JSON.parse(localStorage.getItem(KEY)||'null');

    if(old && typeof old==='object'){
      return normalizeDB(old);
    }

    return normalizeDB(freshDB());

  }catch(e){

    return normalizeDB(freshDB());

  }

}

function normalizeDB(x){

  const base=freshDB();

  x.month=x.month||base.month;
  x.year=x.year||base.year;

  x.settings=x.settings||{};

  x.settings.cashierDivisor=
    Number(x.settings.cashierDivisor)||3;

  x.settings.dailyTarget=
    Number(x.settings.dailyTarget)||0;

  x.weeks=x.weeks||{};

  for(let w=1;w<=4;w++){

    if(!x.weeks[w]){
      x.weeks[w]={
        items:[],
        actual:{},
        daily:{}
      };
    }

    x.weeks[w].items=
      Array.isArray(x.weeks[w].items)
      ?x.weeks[w].items:[];

    x.weeks[w].actual=
      x.weeks[w].actual||{};

    x.weeks[w].daily=
      x.weeks[w].daily||{};

    x.weeks[w].items.forEach(item=>{

      if(!item.id){
        item.id='item_'+Date.now()+
          Math.random().toString(36).slice(2);
      }

      if(!Array.isArray(item.variants)){
        item.variants=[];
      }

      if(!Array.isArray(item.photos)){
        item.photos=[];
      }

      item.price=Number(item.price)||0;
      item.target=Number(item.target)||0;

    });

  }

  return x;
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
}

function ensureWeek(w=week){

  if(!db.weeks)db.weeks={};

  if(!db.weeks[w]){

    db.weeks[w]={
      items:[],
      actual:{},
      daily:{}
    };

  }

  return db.weeks[w];
}

function data(){
  return ensureWeek(week);
}

function daysInWeek(w=week){

  const y=Number(db.year);
  const m=Number(db.month);

  const last=new Date(y,m,0).getDate();

  const ranges={
    1:[1,7],
    2:[8,15],
    3:[16,23],
    4:[24,last]
  };

  return ranges[w];
}

function weekDays(w=week){

  const r=daysInWeek(w);

  return r[1]-r[0]+1;
}

function monthText(){

  return new Date(
    Number(db.year),
    Number(db.month)-1,
    1
  ).toLocaleString(
    'id-ID',
    {month:'long'}
  ).toUpperCase();

}

function weekName(w=week){

  const r=daysInWeek(w);

  return `WEEK ${w} | ${String(r[0]).padStart(2,'0')}-${String(r[1]).padStart(2,'0')} ${monthText()} ${db.year}`;

}

function dateKey(day){

  return `${db.year}-${String(db.month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

}

function weekDates(w=week){

  const r=daysInWeek(w);

  const arr=[];

  for(let d=r[0];d<=r[1];d++){
    arr.push(dateKey(d));
  }

  return arr;

}

function todayKey(){

  const d=new Date();

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

}

function selectedDay(){

  const dates=weekDates();

  if(selectedDate && dates.includes(selectedDate)){
    return selectedDate;
  }

  const t=todayKey();

  if(dates.includes(t)){
    return t;
  }

  return dates[0];

}

function dateLabel(s){

  if(!s)return '-';

  const p=s.split('-').map(Number);

  return `${String(p[2]).padStart(2,'0')} ${new Date(p[0],p[1]-1,1).toLocaleString('id-ID',{month:'short'})} ${p[0]}`;

}

function rup(n){

  return 'Rp'+Number(n||0).toLocaleString('id-ID');

}

function fmt(n){

  return Number(n||0).toLocaleString(
    'id-ID',
    {maximumFractionDigits:2}
  );

}

function pct(a,t){

  a=Number(a||0);
  t=Number(t||0);

  return t ? (a/t*100).toFixed(2)+'%' : '0%';

}

function pctNumber(a,t){

  a=Number(a||0);
  t=Number(t||0);

  return t ? a/t*100 : 0;

}

function esc(s){

  return String(s??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}

function cashierDivisor(){

  const n=Number(
    db.settings?.cashierDivisor
  );

  return n>0?n:3;

}

function dailyTarget(){

  return Number(
    db.settings?.dailyTarget||0
  );

}

function targetWeek(){

  return dailyTarget()*weekDays();

}

function targetItemWeek(item){

  return Number(item.target||0)*weekDays();

}

function actualOnDate(id,date,w=week){

  const d=ensureWeek(w);

  return Number(
    d.daily?.[date]?.[id]||0
  );

}

function actualItem(id,w=week){

  const dates=weekDates(w);

  let total=0;

  dates.forEach(dt=>{
    total+=actualOnDate(id,dt,w);
  });

  return total;

}

function totalActual(w=week){

  const d=ensureWeek(w);

  return d.items.reduce(
    (sum,item)=>
      sum+actualItem(item.id,w),
    0
  );

}

function actualToday(){

  const dt=selectedDay();

  const d=data();

  return d.items.reduce(
    (sum,item)=>
      sum+actualOnDate(item.id,dt),
    0
  );

}

function actualWeekUntil(date,w=week){

  const dates=weekDates(w);

  let total=0;

  dates.forEach(dt=>{

    if(dt<=date){
      total+=
        ensureWeek(w).items.reduce(
          (sum,item)=>
            sum+actualOnDate(item.id,dt,w),
          0
        );
    }

  });

  return total;

}

function dayTarget(){

  return dailyTarget();

}

function dayResult(date=selectedDay()){

  const target=dayTarget();

  const actual=
    ensureWeek(week).items.reduce(
      (sum,item)=>
        sum+actualOnDate(item.id,date),
      0
    );

  const diff=actual-target;

  return {
    target,
    actual,
    acv:pctNumber(actual,target),
    diff
  };

}

function weekResult(w=week){

  const target=targetWeek();
  const actual=totalActual(w);
  const diff=actual-target;

  return {
    target,
    actual,
    acv:pctNumber(actual,target),
    diff
  };

}

function remainingWeek(){

  const r=weekResult();

  return Math.max(0,r.target-r.actual);

}

function currentWeekIndex(){

  const dates=weekDates();

  const d=selectedDay();

  const i=dates.indexOf(d);

  return i<0?0:i;

}

function remainingDays(){

  return Math.max(
    0,
    weekDays()-currentWeekIndex()-1
  );

}

function requiredAverage(){

  const rem=remainingWeek();
  const days=remainingDays();

  return days>0?rem/days:rem;

}

function statusClass(acv){

  if(acv>=100)return 'green';

  if(acv>=80)return 'orange';

  return 'red';

}

function statusText(diff){

  if(diff>0)return `Lebih ${fmt(diff)} pcs`;

  if(diff<0)return `Kurang ${fmt(Math.abs(diff))} pcs`;

  return 'Sesuai Target';

}

function statusBadge(diff){

  if(diff>0){
    return `<span class="badge goodbg green">LEBIH</span>`;
  }

  if(diff<0){
    return `<span class="badge badbg red">KURANG</span>`;
  }

  return `<span class="badge goodbg green">SESUAI TARGET</span>`;

}

function tabs(){

  return `
  <div class="tabs">

    ${[1,2,3,4].map(w=>`

      <button
        class="${week===w?'active':''}"
        onclick="setWeek(${w})">

        Week ${w}

      </button>

    `).join('')}

  </div>
  `;

}

function monthControl(){

  return `
  <div class="monthbar">

    <label>Bulan</label>

    <input
      type="month"
      value="${db.year}-${String(db.month).padStart(2,'0')}"
      onchange="changeMonth(this.value)"
    >

  </div>
  `;

}

function setWeek(w){

  week=Number(w);

  selectedDate='';

  render();

}

function changeMonth(v){

  if(!v)return;

  const p=v.split('-').map(Number);

  db.year=p[0];
  db.month=p[1];

  week=1;
  selectedDate='';

  save();
  render();

}

function setDate(v){

  selectedDate=v;

  render();

}

function render(){

  const app=document.getElementById('app');

  if(page==='dashboard'){
    app.innerHTML=dashboard();
  }

  if(page==='produk'){
    app.innerHTML=produk();
  }

  if(page==='kasir'){
    app.innerHTML=kasir();
  }

  if(page==='laporan'){
    app.innerHTML=laporan();
  }

  if(page==='info'){
    app.innerHTML=infoTarget();
  }

  if(page==='pengaturan'){
    app.innerHTML=pengaturan();
  }

  document
    .querySelectorAll('.nav button')
    .forEach(b=>{
      b.classList.toggle(
        'active',
        b.dataset.page===page
      );
    });

}

function go(p){

  page=p;

  render();

}

/* =========================================================
   HOME / DASHBOARD
========================================================= */

function dashboard(){

  const wr=weekResult();
  const dr=dayResult();

  const idx=currentWeekIndex();
  const dates=weekDates();

  const rem=remainingWeek();
  const remDays=remainingDays();

  const avg=requiredAverage();

  const divisor=cashierDivisor();

  const cashierTarget=
    dailyTarget()/divisor;

  const cashierActual=
    dr.actual/divisor;

  const cashierACV=
    pctNumber(cashierActual,cashierTarget);

  const cashierDiff=
    cashierActual-cashierTarget;

  const products=data().items;

  return `

  ${monthControl()}

  ${tabs()}

  <div class="card">

    <div class="date-select">

      <div>

        <label>Pencapaian Hari</label>

        <input
          type="date"
          value="${selectedDay()}"
          onchange="setDate(this.value)"
        >

      </div>

      <button
        class="secondary"
        onclick="setDate(todayKey())">

        Hari Ini

      </button>

    </div>

  </div>

  <!-- TARGET TOKO -->

  <div class="card home-main">

    <div class="home-title">

      <div class="home-icon">🎯</div>

      <div>

        <h2>Pencapaian Target Toko</h2>

        <div class="muted">
          ${weekName(week)}
        </div>

      </div>

    </div>

    <div class="grid">

      <div class="stat">

        Target Week

        <b>${fmt(wr.target)} pcs</b>

      </div>

      <div class="stat">

        Actual Week

        <b class="green">
          ${fmt(wr.actual)} pcs
        </b>

      </div>

      <div class="stat">

        ACV Week

        <b class="${statusClass(wr.acv)} big-acv">
          ${wr.acv.toFixed(2)}%
        </b>

      </div>

      <div class="stat">

        ${wr.diff>=0?'Lebih':'Kekurangan'}

        <b class="${wr.diff>=0?'green':'red'}">

          ${fmt(Math.abs(wr.diff))} pcs

        </b>

      </div>

    </div>

    <div class="progress">

      <i style="width:${Math.min(100,Math.max(0,wr.acv))}%"></i>

    </div>

    <div class="row">

      <span class="muted">0 pcs</span>

      <b>${wr.acv.toFixed(2)}%</b>

      <span class="muted">${fmt(wr.target)} pcs</span>

    </div>

  </div>


  <!-- PENCAPAIAN HARI INI -->

  <div class="card daily-card">

    <div class="section-head">

      <div class="home-title">

        <div class="home-icon">📅</div>

        <div>

function inputDailyStore(){

  const d=data();

  if(!d.items.length){

    alert(
      'Tambahkan produk terlebih dahulu di menu Produk.'
    );

    go('produk');

    return;

  }

  const date=selectedDay();

  d.items.forEach(item=>{

    const old=
      actualOnDate(item.id,date);

    const value=prompt(
      `Actual ${item.name} pada ${dateLabel(date)} (qty):`,
      old
    );

    if(value===null)return;

    const q=Math.max(
      0,
      Number(value)||0
    );

    if(!d.daily[date]){
      d.daily[date]={};
    }

    d.daily[date][item.id]=q;

  });

  save();

  render();

  toast('Actual harian berhasil disimpan.');

}

function addItem(){

  const name=prompt(
    'Nama produk / item PSM:'
  );

  if(!name)return;

  const price=Number(
    prompt(
      `Harga ${name} per pcs (Rp):`,
      '0'
    )
  )||0;

  const target=Number(
    prompt(
      `Target ${name} per hari (opsional):`,
      '0'
    )
  )||0;

  const variants=prompt(
    'Variant produk (opsional), pisahkan dengan koma:',
    ''
  );

  const item={

    id:
      'item_'+Date.now()+
      '_'+Math.random().toString(36).slice(2,7),

    name:name.trim(),

    price,

    target,

    variants:
      variants
      ?variants.split(',')
        .map(x=>x.trim())
        .filter(Boolean)
      :[],

    photo:''
  };

  data().items.push(item);

  save();

  if(confirm(
    'Produk berhasil dibuat.\n\nMau upload foto produk sekarang?'
  )){

    uploadPhoto(item.id);

  }else{

    render();
    toast('Produk berhasil ditambahkan.');

  }

}

function editItem(id){

  const item=
    data().items.find(x=>x.id===id);

  if(!item)return;

  const name=prompt(
    'Nama produk:',
    item.name
  );

  if(name===null)return;

  const price=Number(
    prompt(
      'Harga per pcs (Rp):',
      item.price
    )
  );

  if(!Number.isFinite(price)||price<0)return;

  const variants=prompt(
    'Variant dipisahkan koma:',
    (item.variants||[]).join(', ')
  );

  item.name=name.trim();

  item.price=price;

  item.variants=
    variants
    ?variants.split(',')
      .map(x=>x.trim())
      .filter(Boolean)
    :[];

  save();

  render();

  toast('Produk berhasil diperbarui.');

}

function setItemTarget(id){

  const item=
    data().items.find(x=>x.id===id);

  if(!item)return;

  const v=Number(
    prompt(
      `Target ${item.name} per hari (qty):`,
      item.target||0
    )
  );

  if(!Number.isFinite(v)||v<0)return;

  item.target=v;

  save();

  render();

  toast('Target produk disimpan.');

}

function uploadPhoto(id){

  const item=
    data().items.find(x=>x.id===id);

  if(!item)return;

  const input=document.createElement('input');

  input.type='file';
  input.accept='image/*';

  input.onchange=e=>{

    const file=e.target.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=ev=>{

      item.photo=ev.target.result;

      save();

      render();

      toast('Foto produk berhasil disimpan.');

    };

    reader.readAsDataURL(file);

  };

  input.click();

}

function inputProductActual(id){

  const item=
    data().items.find(x=>x.id===id);

  if(!item)return;

  const date=selectedDay();

  const old=
    actualOnDate(id,date);

  const v=prompt(
    `Actual ${item.name} - ${dateLabel(date)} (qty):`,
    old
  );

  if(v===null)return;

  const q=Math.max(
    0,
    Number(v)||0
  );

  if(!data().daily[date]){
    data().daily[date]={};
  }

  data().daily[date][id]=q;

  save();

  render();

  toast('Actual produk berhasil disimpan.');

}

function delItem(id){

  const item=
    data().items.find(x=>x.id===id);

  if(!item)return;

  if(!confirm(
    `Hapus produk "${item.name}"?`
  ))return;

  const d=data();

  d.items=
    d.items.filter(x=>x.id!==id);

  delete d.actual[id];

  Object.keys(d.daily||{}).forEach(dt=>{

    if(d.daily[dt]){
      delete d.daily[dt][id];
    }

  });

  save();

  render();

  toast('Produk berhasil dihapus.');

}

Harga : ${rup(x.price)}

function monthlyResult(){

  let target=0;
  let actual=0;

  for(let w=1;w<=4;w++){

    target+=targetWeek();

    actual+=totalActual(w);

  }

  return {

    target,
    actual,
    acv:pctNumber(actual,target),
    diff:actual-target

  };

}

function saveDivisor(){

  const v=Number(
    document.getElementById(
      'divisorInput'
    ).value
  );

  if(!Number.isFinite(v)||v<1){

    alert('Pembagi minimal 1.');

    return;

  }

  db.settings.cashierDivisor=
    Math.round(v);

  save();

  render();

  toast('Pembagi berhasil disimpan.');

}

function saveDailyTarget(){

  const v=Number(
    document.getElementById(
      'dailyTargetInput'
    ).value
  );

  if(!Number.isFinite(v)||v<0){

    alert('Target tidak valid.');

    return;

  }

  db.settings.dailyTarget=v;

  save();

  render();

  toast('Target keseluruhan berhasil disimpan.');

}

/* =========================================================

========================================================= */

function toast(message){

  const el=
    document.getElementById('toast');

  el.textContent=message;

  el.style.display='block';

  clearTimeout(window.toastTimer);

  window.toastTimer=
    setTimeout(()=>{

      el.style.display='none';

    },2200);

}


/* =========================================================
   MIGRASI DATA LAMA
========================================================= */

(function migrateOldData(){

  try{

    const oldKey='psm_monitoring_v2';

    const old=
      JSON.parse(
        localStorage.getItem(oldKey)||'null'
      );

    if(
      old &&
      old.weeks &&
      !localStorage.getItem(KEY+'_migrated')
    ){

      for(let w=1;w<=4;w++){

        if(!old.weeks[w])continue;

        const ow=old.weeks[w];

        const nw=ensureWeek(w);

        if(Array.isArray(ow.items)){

          ow.items.forEach(x=>{

            if(
              !nw.items.some(
                n=>n.id===x.id
              )
            ){

              nw.items.push({

                id:x.id||
                  'item_'+Date.now(),

                name:x.name||'Produk',

                price:Number(x.price)||0,

                target:Number(x.target)||0,

                variants:
                  Array.isArray(x.variants)
                  ?x.variants
                  :[],

                photo:''

              });

            }

          });

        }

        if(ow.daily){

          nw.daily=
            Object.assign(
              nw.daily,
              ow.daily
            );

        }

      }

      if(old.settings){

        db.settings=
          Object.assign(
            db.settings,
            old.settings
          );

      }

      localStorage.setItem(
        KEY+'_migrated',
        '1'
      );

      save();

    }

  }catch(e){

    console.log(
      'Migrasi dilewati',
      e
    );

  }

})();
